[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cynober-db"
version = "7.9.0"
description = "Cynober DB — relacyjno-grafowa baza z tunelem post-quantum HSS+HSL i KarminQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Mazur", email = "drwisz@gmail.com" }]
keywords = ["database", "post-quantum", "graph", "rpc", "karminql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "numpy>=1.24",
    "cryptography>=41.0",
]

[project.optional-dependencies]
viz = ["plotly>=5.0", "pandas>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
cynober-server = "cynober_server:main"
cynober-cli = "Cynober_db:main"
cynober-konfigurator = "cynober_konfigurator:main"

[project.urls]
Homepage = "https://github.com/Maciej-EriAmo/DBase"
Documentation = "https://github.com/Maciej-EriAmo/DBase/blob/master/cynober_manual.md"

[tool.setuptools]
py-modules = [
    "cynober_client",
    "cynober_client_config",
    "cynober_firewall",
    "cynober_gossip",
    "cynober_konfigurator",
    "cynober_lambda_bridge",
    "cynober_ops",
    "cynober_pandas_bridge",
    "cynober_query_engine",
    "cynober_rate_limit",
    "cynober_replicate",
    "cynober_rpc",
    "cynober_server",
    "cynober_world_auth",
    "cynober_worlds",
    "Cynober_db",
    "game_store",
    "karmazyn_atom",
    "karmazyn_atomstore",
    "karmazyn_exec",
    "karmazyn_handshake",
    "karmazyn_hrr",
    "karmazyn_hsl",
    "karmazyn_hss",
    "karmazyn_hss_ntt",
    "karmazyn_kafd",
    "karmazyn_kernel",
    "karmazyn_proca",
    "karmazyn_qkd",
    "karmazyn_store",
    "karmazyn_substrate",
]

[tool.setuptools.package-data]
"*" = ["*.md", "scripts/*"]